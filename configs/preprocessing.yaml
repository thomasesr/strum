# Preprocessing Configuration

# Audio settings
audio:
  sample_rate: 44100
  mono: false  # Keep stereo for Demucs, convert later
  target_lufs: -14.0
  supported_formats: [".wav", ".mp3", ".flac", ".ogg", ".m4a"]

# Stage 0: karaoke pre-separation (Mel-Band RoFormer).
# Strips the LEAD vocal before the 6-stem pass so sung melodies stop bleeding
# into the other/guitar/piano stems and showing up as phantom basic-pitch notes.
# Backing vocals survive into `instrumental` by design — karaoke models are
# trained to remove the lead only. Env overrides: STRUM_KARAOKE_*.
karaoke:
  enabled: true
  backend: audio-separator      # or "msst" for becruily/gabox checkpoints
  model: mel_band_roformer_karaoke_aufr33_viperx_sdr_10.1956.ckpt
  # Second pass: lift backing vocals into their own stem so the 6-stem model
  # gets a fully vocal-free mix and HARM2/HARM3 get a clean source.
  # Recommended on; off by default to preserve the single-pass behaviour.
  backing_split: false
  backing_model: model_bs_roformer_ep_317_sdr_12.9755.ckpt

# Stage 1 backend: "demucs" or "bs_roformer_sw". Both emit the same stem names.
# BS-RoFormer SW needs STRUM_ROFORMER_CKPT / STRUM_ROFORMER_CFG / an MSST checkout.
separator: demucs

roformer:
  model_type: bs_roformer
  ckpt: null                    # bs_6stem_fixed.ckpt
  config: null                  # bs_6stem_fixed_config.yaml
  msst_dir: null
  timeout_s: 2400

# Demucs separation
demucs:
  model: htdemucs
  device: cuda  # or "cpu"
  shifts: 1     # Number of random shifts for better quality (more = slower)
  overlap: 0.25
  split: true   # Split into segments for memory efficiency
  segment_length: 7.8  # Max segment length in seconds for HT Demucs
  
  # Output stems
  stems:
    - drums
    - bass  
    - vocals
    - other

# Chart parsing
parsing:
  # Supported chart formats
  formats: [".mid", ".chart"]
  
  # MIDI parsing
  midi:
    ticks_per_beat: 480
    drum_track_names: ["PART DRUMS", "PART REAL_DRUMS_PS", "drums"]
    
  # .chart parsing
  chart:
    resolution: 192
    difficulties: ["Expert", "Hard", "Medium", "Easy"]

# Dataset split
split:
  train_ratio: 0.85
  test_ratio: 0.15
  seed: 42
  # Use deterministic hash-based split for reproducibility
  hash_based: true

# Audio-chart alignment
alignment:
  enabled: true
  method: cross_correlation
  max_offset_ms: 100
  search_resolution_ms: 1

# Output settings
output:
  # Stem output format
  stem_format: wav
  stem_sample_rate: 44100
  stem_bit_depth: 16
  
  # Manifest
  manifest_name: manifest.json
  
# Parallel processing
parallel:
  enabled: true
  max_workers: 4
  
# Logging
logging:
  level: INFO
  progress_bar: true
