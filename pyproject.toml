[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strum"
version = "0.1.0"
description = "Local-first audio-to-game-chart transcription pipeline for Clone Hero and YARG"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "STRUM Team"}
]
keywords = [
    "audio",
    "transcription",
    "midi",
    "clone-hero",
    "yarg",
    "drums",
    "music",
    "machine-learning",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core ML
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "numpy>=1.24.0",
    
    # Audio processing
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    
    # MIDI handling
    "mido>=1.3.0",
    "pretty_midi>=0.2.10",
    
    # Configuration & CLI
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    
    # Experiment tracking
    "wandb>=0.16.0",
    
    # Data handling
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
# Demucs for stem separation (drums pipeline)
separation = [
    "demucs>=4.0.0",
]
# Basic Pitch for guitar/bass/vocals AMT (requires TensorFlow)
pitch = [
    "basic-pitch>=0.3.0",
]
# Mel-Band RoFormer karaoke pre-separation (lead-vocal removal before Demucs).
# The BS-RoFormer SW 6-stem backend needs a ZFTurbo MSST checkout instead —
# see docs/SEPARATION.md.
karaoke = [
    "audio-separator>=0.24.0",
]
# Full pipeline with all features
full = [
    "demucs>=4.0.0",
    "basic-pitch>=0.3.0",
    "audio-separator>=0.24.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/opria123/strum"
Documentation = "https://github.com/opria123/strum/blob/main/docs/ARCHITECTURE.md"
Repository = "https://github.com/opria123/strum"
Issues = "https://github.com/opria123/strum/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
